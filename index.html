<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Deep-Work Shield</title>
  <link id="pwa-manifest" rel="manifest" />
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141822;
      --surface-elevated: #1c2230;
      --border: #262e40;
      --text: #eef2f9;
      --muted: #8b96ad;
      --accent: #60a5fa;
      --accent-glow: rgba(96, 165, 250, 0.18);
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      line-height: 1.5;
    }

    .app-shell {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .stats-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .stats-pill strong {
      color: var(--success);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .hidden {
      display: none !important;
    }

    .resume-banner {
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    .resume-banner-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--warning);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .resume-banner-text {
      font-size: 0.92rem;
      color: var(--text);
    }

    label.field-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 13px 15px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .preset-btn {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 6px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }

    .custom-mins-wrap {
      margin-top: 10px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 14px 18px;
      font-size: 0.98rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.08s, opacity 0.15s;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--accent);
      color: #07101d;
      margin-top: 18px;
    }

    .btn-secondary {
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .cockpit-goal {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin-bottom: 18px;
      word-break: break-word;
    }

    .timer-ring-wrap {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-ring-wrap svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--surface-elevated);
      stroke-width: 8;
    }

    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.35s linear;
    }

    .timer-readout {
      text-align: center;
      z-index: 1;
    }

    .timer-digits {
      font-size: 2.5rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .timer-status {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 2px;
    }

    .parking-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .parking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .parked-badge {
      background: var(--surface-elevated);
      color: var(--accent);
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.76rem;
    }

    .parking-form {
      display: flex;
      gap: 8px;
    }

    .parking-submit {
      width: auto;
      padding: 0 16px;
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .parked-toast {
      font-size: 0.78rem;
      color: var(--success);
      margin-top: 6px;
      min-height: 18px;
    }

    .cockpit-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .triage-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .triage-text {
      font-size: 0.94rem;
      word-break: break-word;
    }

    .triage-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mini-btn {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-btn.accent {
      border-color: var(--accent);
      color: var(--accent);
    }

    .mini-btn.danger {
      color: var(--danger);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    details.backlog-drawer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
    }

    details.backlog-drawer summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--muted);
      list-style: none;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 420px) {
      .card { padding: 18px 15px; }
      .timer-ring-wrap { width: 180px; height: 180px; }
      .timer-digits { font-size: 2.15rem; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Deep-Work Shield</span>
      </div>
      <div class="stats-pill">Today: <strong id="today-stats">0m (0 blocks)</strong></div>
    </header>

    <!-- STATE A: SETUP -->
    <section id="view-setup" class="card">
      <div id="resume-banner" class="resume-banner hidden">
        <div class="resume-banner-label">Where You Left Off</div>
        <div id="resume-banner-text" class="resume-banner-text"></div>
      </div>

      <label class="field-label" for="goal-input">Single Block Objective</label>
      <input type="text" id="goal-input" placeholder="e.g., Resolve Sprint Jira blocker #412" autocomplete="off" />

      <label class="field-label" style="margin-top: 16px;">Block Duration</label>
      <div class="presets">
        <button type="button" class="preset-btn" data-mins="25">25m</button>
        <button type="button" class="preset-btn active" data-mins="45">45m</button>
        <button type="button" class="preset-btn" data-mins="60">60m</button>
        <button type="button" class="preset-btn" data-mins="90">90m</button>
        <button type="button" class="preset-btn" data-mins="custom">Custom</button>
      </div>
      <div id="custom-mins-wrap" class="custom-mins-wrap hidden">
        <input type="number" id="custom-mins-input" min="1" max="240" value="30" placeholder="Minutes (1-240)" />
      </div>

      <button type="button" id="start-btn" class="btn btn-primary">Lock In &amp; Start Focus</button>
    </section>

    <!-- STATE B: ACTIVE COCKPIT -->
    <section id="view-active" class="card hidden">
      <div id="active-goal-display" class="cockpit-goal"></div>

      <div class="timer-ring-wrap">
        <svg viewBox="0 0 210 210">
          <circle class="ring-bg" cx="105" cy="105" r="94"></circle>
          <circle id="ring-progress" class="ring-progress" cx="105" cy="105" r="94" stroke-dasharray="590.6" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-readout">
          <div id="timer-digits" class="timer-digits">45:00</div>
          <div id="timer-status" class="timer-status">Shield Active</div>
        </div>
      </div>

      <div class="parking-box">
        <div class="parking-header">
          <span>Mental Parking Lot (Hidden)</span>
          <span id="parked-count-badge" class="parked-badge">0 parked</span>
        </div>
        <form id="parking-form" class="parking-form">
          <input type="text" id="parking-input" enterkeyhint="send" placeholder="Stray thought? Park it here..." autocomplete="off" />
          <button type="submit" class="parking-submit">Park</button>
        </form>
        <div id="parked-toast" class="parked-toast"></div>
      </div>

      <div class="cockpit-actions">
        <button type="button" id="pause-btn" class="btn btn-secondary">Pause / Snapshot</button>
        <button type="button" id="finish-early-btn" class="btn btn-danger-ghost">End &amp; Triage</button>
      </div>
    </section>

    <!-- STATE C: END-OF-BLOCK TRIAGE -->
    <section id="view-triage" class="card hidden">
      <h2 style="font-size: 1.15rem; margin-bottom: 4px;">Block Complete</h2>
      <p id="triage-summary" style="font-size: 0.88rem; color: var(--muted); margin-bottom: 16px;"></p>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px;">
        <button type="button" id="outcome-done-btn" class="btn btn-secondary" style="border-color: var(--success); color: var(--success);">✓ Goal Completed</button>
        <button type="button" id="outcome-carry-btn" class="btn btn-secondary">↻ Carry Over Goal</button>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <label class="field-label" style="margin: 0;">Captured Thoughts</label>
        <button type="button" id="copy-md-btn" class="mini-btn accent">Copy All Markdown</button>
      </div>
      <div id="triage-list"></div>

      <button type="button" id="new-session-btn" class="btn btn-primary">Done &amp; Return to Setup</button>
    </section>

    <!-- LATER BACKLOG DRAWER -->
    <details id="backlog-drawer" class="backlog-drawer">
      <summary>
        <span>Later Backlog</span>
        <span id="backlog-count">0 items</span>
      </summary>
      <div id="backlog-list" style="margin-top: 12px;"></div>
    </details>
  </div>

  <!-- PAUSE CONTEXT SNAPSHOT MODAL -->
  <div id="pause-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 style="font-size: 1.05rem; margin-bottom: 6px;">Save Context Snapshot</h3>
      <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 12px;">
        Write one line on where you stopped so you can resume without friction.
      </p>
      <input type="text" id="snapshot-input" placeholder="e.g., Verified API payload, next check auth header" />
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;">
        <button type="button" id="resume-now-btn" class="btn btn-secondary">Resume Now</button>
        <button type="button" id="save-pause-btn" class="btn btn-primary" style="margin-top: 0;">Save &amp; Exit</button>
      </div>
    </div>
  </div>

  <script>
    (function setupManifest() {
      const iconSvg = encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#0b0d12"/><path d="M96 164s56-28 56-70V45l-56-21-56 21v49c0 42 56 70 56 70z" fill="none" stroke="#60a5fa" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      );
      const manifest = {
        name: "Deep-Work Shield",
        short_name: "WorkShield",
        start_url: "./",
        display: "standalone",
        background_color: "#0b0d12",
        theme_color: "#0b0d12",
        icons: [{ src: `data:image/svg+xml,${iconSvg}`, sizes: "192x192", type: "image/svg+xml" }]
      };
      document.getElementById("pwa-manifest").href =
        "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
    })();

    const STORAGE_KEY = "deep_work_shield_v2";
    const CIRCUMFERENCE = 2 * Math.PI * 94;
    let selectedMinutes = 45;
    let tickInterval = null;
    let wakeLock = null;
    let audioCtx = null;

    const defaultState = () => ({
      activeSession: null,
      resumeNote: "",
      triageItems: [],
      laterBacklog: [],
      dailyStats: { date: new Date().toDateString(), minutes: 0, blocks: 0 }
    });

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        const today = new Date().toDateString();
        if (!parsed.dailyStats || parsed.dailyStats.date !== today) {
          parsed.dailyStats = { date: today, minutes: 0, blocks: 0 };
        }
        return { ...defaultState(), ...parsed };
      } catch {
        return defaultState();
      }
    }

    let state = loadState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderStatsAndBacklog();
    }

    function unlockAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    }

    function playCompletionChime() {
      try {
        unlockAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [523.25, 659.25].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + idx * 0.18);
          gain.gain.setValueAtTime(0.001, now + idx * 0.18);
          gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.18 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.18 + 0.9);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.18);
          osc.stop(now + idx * 0.18 + 0.95);
        });
      } catch {}
    }

    async function requestWakeLock() {
      if ("wakeLock" in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request("screen");
        } catch {}
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && state.activeSession?.status === "running") {
        requestWakeLock();
        updateTimerUI();
      }
    });

    const views = {
      setup: document.getElementById("view-setup"),
      active: document.getElementById("view-active"),
      triage: document.getElementById("view-triage")
    };

    function showView(name) {
      Object.entries(views).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
    }

    function formatTime(sec) {
      const s = Math.max(0, sec);
      const mins = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(mins).padStart(2, "0")}:${String(rem).padStart(2, "0")}`;
    }

    function escapeHtml(str) {
      const p = document.createElement("p");
      p.textContent = str;
      return p.innerHTML;
    }

    function renderStatsAndBacklog() {
      document.getElementById("today-stats").textContent =
        `${state.dailyStats.minutes}m (${state.dailyStats.blocks} blocks)`;
      document.getElementById("backlog-count").textContent = `${state.laterBacklog.length} items`;

      const list = document.getElementById("backlog-list");
      list.innerHTML = "";
      if (!state.laterBacklog.length) {
        list.innerHTML = `<p style="font-size:0.84rem;color:var(--muted);">No deferred tasks.</p>`;
        return;
      }
      state.laterBacklog.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "triage-item";
        div.innerHTML = `
          <div class="triage-text">${escapeHtml(item.text)}</div>
          <div class="triage-btns">
            <button type="button" class="mini-btn accent" data-act="promote">Set as Next Goal</button>
            <button type="button" class="mini-btn danger" data-act="delete">Remove</button>
          </div>
        `;
        div.querySelector('[data-act="promote"]').onclick = () => {
          document.getElementById("goal-input").value = item.text;
          state.laterBacklog.splice(index, 1);
          saveState();
          showView("setup");
        };
        div.querySelector('[data-act="delete"]').onclick = () => {
          state.laterBacklog.splice(index, 1);
          saveState();
        };
        list.appendChild(div);
      });
    }

    document.querySelectorAll(".preset-btn").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll(".preset-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const val = btn.dataset.mins;
        const customWrap = document.getElementById("custom-mins-wrap");
        if (val === "custom") {
          customWrap.classList.remove("hidden");
          selectedMinutes = parseInt(document.getElementById("custom-mins-input").value, 10) || 30;
        } else {
          customWrap.classList.add("hidden");
          selectedMinutes = parseInt(val, 10);
        }
      };
    });

    document.getElementById("custom-mins-input").oninput = (e) => {
      selectedMinutes = Math.max(1, Math.min(240, parseInt(e.target.value, 10) || 30));
    };

    function startFocusSession(goal, durationMinutes) {
      unlockAudio();
      const totalSeconds = durationMinutes * 60;
      state.activeSession = {
        goal,
        totalSeconds,
        endTime: Date.now() + totalSeconds * 1000,
        pausedRemaining: totalSeconds,
        status: "running"
      };
      saveState();
      enterActiveCockpit();
    }

    document.getElementById("start-btn").onclick = () => {
      const goalInput = document.getElementById("goal-input");
      const goal = goalInput.value.trim() || "Deep Focus Session";
      startFocusSession(goal, selectedMinutes);
    };

    function enterActiveCockpit() {
      const sess = state.activeSession;
      if (!sess) return;
      document.getElementById("active-goal-display").textContent = sess.goal;
      document.getElementById("parked-count-badge").textContent = `${state.triageItems.length} parked`;
      document.getElementById("parked-toast").textContent = "";
      showView("active");

      if (sess.status === "running") {
        requestWakeLock();
        startTicker();
      }
      updateTimerUI();
    }

    function startTicker() {
      clearInterval(tickInterval);
      tickInterval = setInterval(updateTimerUI, 250);
    }

    function updateTimerUI() {
      const sess = state.activeSession;
      if (!sess) return;

      const remaining =
        sess.status === "running"
          ? Math.max(0, Math.ceil((sess.endTime - Date.now()) / 1000))
          : sess.pausedRemaining;

      document.getElementById("timer-digits").textContent = formatTime(remaining);
      document.getElementById("timer-status").textContent =
        sess.status === "running" ? "Shield Active" : "Paused";

      const ratio = sess.totalSeconds > 0 ? remaining / sess.totalSeconds : 0;
      const offset = CIRCUMFERENCE * (1 - ratio);
      document.getElementById("ring-progress").style.strokeDashoffset = offset;

      if (sess.status === "running" && remaining <= 0) {
        completeBlock(true);
      }
    }

    document.getElementById("parking-form").onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById("parking-input");
      const text = input.value.trim();
      if (!text) return;

      state.triageItems.push({ id: Date.now(), text });
      saveState();

      input.value = "";
      document.getElementById("parked-count-badge").textContent = `${state.triageItems.length} parked`;
      const toast = document.getElementById("parked-toast");
      toast.textContent = "✓ Thought safely parked out of sight";
      if (navigator.vibrate) navigator.vibrate(25);
      setTimeout(() => {
        if (toast.textContent.includes("parked")) toast.textContent = "";
      }, 2200);
    };

    document.getElementById("pause-btn").onclick = () => {
      const sess = state.activeSession;
      if (!sess) return;
      if (sess.status === "running") {
        sess.pausedRemaining = Math.max(0, Math.ceil((sess.endTime - Date.now()) / 1000));
        sess.status = "paused";
        clearInterval(tickInterval);
        releaseWakeLock();
        saveState();
        updateTimerUI();
      }
      document.getElementById("snapshot-input").value = state.resumeNote || "";
      document.getElementById("pause-modal").classList.remove("hidden");
    };

    document.getElementById("resume-now-btn").onclick = () => {
      document.getElementById("pause-modal").classList.add("hidden");
      const sess = state.activeSession;
      if (!sess) return;
      sess.endTime = Date.now() + sess.pausedRemaining * 1000;
      sess.status = "running";
      saveState();
      requestWakeLock();
      startTicker();
      updateTimerUI();
    };

    document.getElementById("save-pause-btn").onclick = () => {
      const note = document.getElementById("snapshot-input").value.trim();
      state.resumeNote = note;
      document.getElementById("pause-modal").classList.add("hidden");
      saveState();
      renderSetupBanner();
      showView("setup");
    };

    document.getElementById("finish-early-btn").onclick = () => completeBlock(false);

    function completeBlock(naturalEnd) {
      clearInterval(tickInterval);
      releaseWakeLock();
      if (naturalEnd) playCompletionChime();

      const sess = state.activeSession;
      const elapsedSec = sess
        ? sess.totalSeconds -
          (sess.status === "running"
            ? Math.max(0, Math.ceil((sess.endTime - Date.now()) / 1000))
            : sess.pausedRemaining)
        : 0;
      const loggedMins = Math.max(1, Math.round(elapsedSec / 60));

      state.dailyStats.minutes += loggedMins;
      state.dailyStats.blocks += 1;
      const finishedGoal = sess ? sess.goal : "Focus Block";
      state.activeSession = null;
      saveState();

      document.getElementById("triage-summary").textContent =
        `Logged ${loggedMins} min on "${finishedGoal}".`;
      document.getElementById("outcome-carry-btn").onclick = () => {
        document.getElementById("goal-input").value = finishedGoal;
        showView("setup");
      };
      document.getElementById("outcome-done-btn").onclick = () => {
        document.getElementById("goal-input").value = "";
        state.resumeNote = "";
        saveState();
        renderSetupBanner();
        showView("setup");
      };

      renderTriageList();
      showView("triage");
    }

    function renderTriageList() {
      const container = document.getElementById("triage-list");
      container.innerHTML = "";
      if (!state.triageItems.length) {
        container.innerHTML = `<p style="font-size:0.86rem;color:var(--muted);margin-bottom:14px;">Zero distractions parked during this block.</p>`;
        return;
      }

      state.triageItems.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "triage-item";
        card.innerHTML = `
          <div class="triage-text">${escapeHtml(item.text)}</div>
          <div class="triage-btns">
            <button type="button" class="mini-btn accent" data-act="do5">Do Now (5m)</button>
            <button type="button" class="mini-btn" data-act="later">Move to Later</button>
            <button type="button" class="mini-btn danger" data-act="drop">Dismiss</button>
          </div>
        `;
        card.querySelector('[data-act="do5"]').onclick = () => {
          state.triageItems.splice(idx, 1);
          saveState();
          startFocusSession(item.text, 5);
        };
        card.querySelector('[data-act="later"]').onclick = () => {
          state.laterBacklog.push(item);
          state.triageItems.splice(idx, 1);
          saveState();
          renderTriageList();
        };
        card.querySelector('[data-act="drop"]').onclick = () => {
          state.triageItems.splice(idx, 1);
          saveState();
          renderTriageList();
        };
        container.appendChild(card);
      });
    }

    document.getElementById("copy-md-btn").onclick = async () => {
      if (!state.triageItems.length) return;
      const md = state.triageItems.map((i) => `- [ ] ${i.text}`).join("\n");
      try {
        await navigator.clipboard.writeText(md);
        const btn = document.getElementById("copy-md-btn");
        btn.textContent = "Copied!";
        setTimeout(() => (btn.textContent = "Copy All Markdown"), 1800);
      } catch {}
    };

    document.getElementById("new-session-btn").onclick = () => {
      renderSetupBanner();
      showView("setup");
    };

    function renderSetupBanner() {
      const banner = document.getElementById("resume-banner");
      if (state.resumeNote) {
        document.getElementById("resume-banner-text").textContent = state.resumeNote;
        banner.classList.remove("hidden");
      } else {
        banner.classList.add("hidden");
      }
    }

    renderStatsAndBacklog();
    renderSetupBanner();

    if (state.activeSession) {
      document.getElementById("goal-input").value = state.activeSession.goal;
      if (state.activeSession.status === "running") {
        enterActiveCockpit();
      } else {
        showView("setup");
      }
    } else {
      showView("setup");
    }
  </script>
</body>
</html>
